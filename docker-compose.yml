---
services:
  # ─────────────────────────────────────────────────
  # SPOT BOTS (custom image with ta-lib + pandas-ta)
  # ─────────────────────────────────────────────────

  freqtrade-spot:
    # Builds Dockerfile.custom (extends freqtradeorg/freqtrade:stable).
    # The image tag is shared by all spot services so it only builds once.
    build:
      context: .
      dockerfile: Dockerfile.custom
    image: freqtrade_custom
    restart: unless-stopped
    container_name: freqtrade-spot
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_spot.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_spot.sqlite
      --config /freqtrade/user_data/config_spot.json
      --strategy SampleStrategy

  freqtrade-spot-macd-rsi:
    image: freqtrade_custom
    restart: unless-stopped
    container_name: freqtrade-spot-macd-rsi
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8084:8084"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_spot_macd_rsi.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_spot_macd_rsi.sqlite
      --config /freqtrade/user_data/config_spot_macd_rsi.json
      --strategy MidTF_MACD_RSI_Strategy_Spot
    depends_on:
      - freqtrade-spot

  freqtrade-spot-bollinger:
